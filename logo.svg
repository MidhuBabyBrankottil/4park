<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="pStemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="118" ry="118" fill="#0A0A0C"/>

  <!-- Inner Soft Inset Border -->
  <rect x="2" y="2" width="508" height="508" rx="116" ry="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- The Stylized 'P' Mark -->
  <g filter="url(#subtleGlow)">
    <!-- Main P Geometry -->
    <path d="
      M 190 160 
      H 320 
      C 375 160 415 198 415 254 
      C 415 308 375 348 316 348 
      C 268 348 238 326 226 295 
      C 220 280 216 280 216 310 
      L 216 350 
      C 216 358 214 360 205 360 
      L 190 360 
      Z
    " fill="url(#pGrad)" />

    <!-- Stylized Stem Sweep -->
    <path d="
      M 190 230 
      L 190 360 
      C 190 360 205 358 216 348 
      C 216 300 220 280 235 272 
      C 260 260 295 272 320 265 
      C 350 257 360 235 348 205 
      C 336 178 300 178 280 185 
      C 240 200 200 210 190 230 
      Z
    " fill="url(#pStemGlow)" opacity="0.4" />

    <!-- Inner Cutout Cavity for Car -->
    <path d="
      M 215 190 
      H 312 
      C 348 190 376 218 376 254 
      C 376 290 348 318 312 318 
      C 278 318 252 298 240 278 
      C 235 270 230 270 224 274 
      C 218 278 215 285 215 292 
      Z
    " fill="#0A0A0C" />

    <!-- Sleek Supercar Front Silhouette -->
    <!-- Car Windshield & Roof Arc -->
    <path d="
      M 248 210 
      C 256 208 272 208 280 210 
      C 288 212 298 222 301 232 
      L 227 232 
      C 230 222 240 212 248 210 
      Z
    " fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Windshield Glass Tint -->
    <path d="
      M 250 212 
      C 256 210 272 210 278 212 
      C 285 214 294 222 297 230 
      L 231 230 
      C 234 222 243 214 250 212 
      Z
    " fill="#0A0A0C" />

    <!-- Car Hood & Upper Bumper Curve -->
    <path d="
      M 218 238 
      C 232 236 296 236 310 238 
      C 316 239 318 242 314 246 
      C 302 249 226 249 214 246 
      C 210 242 212 239 218 238 
      Z
    " fill="#FFFFFF" />

    <!-- Left Aerodynamic Wing Mirror -->
    <path d="M 216 228 C 210 227 206 230 209 233 C 212 235 218 234 219 231 Z" fill="#FFFFFF"/>
    
    <!-- Right Aerodynamic Wing Mirror -->
    <path d="M 312 228 C 318 227 322 230 319 233 C 316 235 310 234 309 231 Z" fill="#FFFFFF"/>

    <!-- Left Slit LED Headlight -->
    <path d="M 226 242 L 244 243 C 242 246 230 247 225 244 Z" fill="#38BDF8"/>

    <!-- Right Slit LED Headlight -->
    <path d="M 302 242 L 284 243 C 286 246 298 247 303 244 Z" fill="#38BDF8"/>
  </g>
</svg>
